<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
:root{
  --board:#EDEFEE; --grid:#D8DEDC; --chip:#FFFFFF; --chip-2:#F4F7F6; --chip-head:#EBEFEE;
  --edge:#C7D0CE; --edge-hi:#AEB9B7; --trace:#AAB5B3; --pad:#B8892E;
  --accent:#8F6717; --pulse:#C79A3F; --ink:#0F1618; --ink-2:#485557; --ink-3:#768385;
  --ok:#2C7457; --fault:#AB362E; --wait:#57657A; --panel:#FFFFFF; --rule:#E2E7E6;
}
:root[data-theme="dark"]{
  --board:#080B0C; --grid:#12191A; --chip:#141A1B; --chip-2:#1A2122; --chip-head:#1A2122;
  --edge:#28312F; --edge-hi:#3B4644; --trace:#41534E; --pad:#C8973F;
  --accent:#D2A24E; --pulse:#FFE3A3; --ink:#E8EEEB; --ink-2:#9CAAA6; --ink-3:#6B7A77;
  --ok:#57AC8D; --fault:#DA5A4F; --wait:#8C93A8; --panel:#111718; --rule:#1E2626;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-feature-settings:"cv05" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mono,.mono *{font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.lab{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.frame{border:1px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--board)}
.bar{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid var(--edge);
  background:var(--panel);flex-wrap:wrap}
.bar .why{font-size:12px;color:var(--ink-3);flex-basis:100%;margin:-3px 0 0 17px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.name{font-size:13.5px;font-weight:600;letter-spacing:-.005em;cursor:text}
.name:focus{outline:1px solid var(--accent);outline-offset:2px;border-radius:2px}
.sp{flex:1}
button{font:inherit;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  background:var(--chip-2);color:var(--ink-2);
  border:1px solid var(--edge);padding:5px 11px;border-radius:3px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--edge-hi)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--board)}
button.ghost{background:transparent}

.scroll{overflow-x:auto;overflow-y:hidden}
.canvas{position:relative;min-height:200px;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:8px 8px}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.trace{fill:none;stroke:var(--trace);stroke-width:1.7;stroke-linejoin:miter}
.trace.hot{stroke:var(--accent);stroke-width:1.9}
.pulse{fill:none;stroke:var(--pulse);stroke-width:2.6;stroke-linecap:round;opacity:.95;
  animation:flow 1.15s linear infinite}
@keyframes flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pad{fill:var(--board);stroke:var(--trace);stroke-width:1.6}
.pad.hot{fill:var(--pad);stroke:var(--pad)}
.hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
.trace.hover{stroke:var(--fault);stroke-width:2.2}
.cut{cursor:pointer;pointer-events:all}
.cut circle{fill:var(--panel);stroke:var(--fault);stroke-width:1.4}
.cut line{stroke:var(--fault);stroke-width:1.5;stroke-linecap:round}
.draft{stroke:var(--accent);stroke-width:1.9;stroke-dasharray:5 4;fill:none;pointer-events:none}

/* output pads: grab one and pull a wire to another chip */
.handle{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -2px;border-radius:2px;
  background:transparent;cursor:crosshair;z-index:4}
.handle:after{content:"";position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;
  background:var(--trace);transition:background .15s,transform .15s}
.handle:hover:after,.handle.armed:after{background:var(--accent);transform:scale(1.5)}
.handle .tip{position:absolute;left:14px;top:-4px;font-size:9.5px;letter-spacing:.04em;color:var(--accent);
  background:var(--panel);border:1px solid var(--edge);border-radius:2px;padding:0 4px;
  opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .12s}
.handle:hover .tip{opacity:1}
.canvas.wiring .node{cursor:copy}
.canvas.wiring .node:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.silk{position:absolute;left:26px;bottom:12px;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);opacity:.5;pointer-events:none}

.node{position:absolute;width:180px;background:var(--chip);border:1px solid var(--edge);
  border-radius:3px;clip-path:polygon(9px 0,100% 0,100% 100%,0 100%,0 9px);cursor:grab;
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.8,.3,1),border-color .18s,box-shadow .18s;
  opacity:0;transform:translateY(6px)}
.node.in{opacity:1;transform:none}
.node.sel{border-color:var(--accent)}
.node.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px -6px var(--accent)}
.node.waiting{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px var(--accent),0 0 18px -8px var(--accent)}
  50%{box-shadow:0 0 0 1px var(--accent),0 0 30px -4px var(--accent)}}
.node.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--edge))}
.node.held{border-color:var(--wait);border-style:dashed}
.node.failed{border-color:var(--fault);background:color-mix(in srgb,var(--fault) 6%,var(--chip))}
.node.failed .ns{color:var(--fault);background:color-mix(in srgb,var(--fault) 14%,transparent)}
.node.retrying{border-color:var(--accent);border-style:dashed}
.node.writes .nt:after{content:"";display:inline-block;width:5px;height:5px;margin-left:6px;
  border-radius:50%;background:var(--accent);vertical-align:middle;opacity:.75}
.node.unbound{border-color:color-mix(in srgb,var(--fault) 62%,var(--edge));
  background:color-mix(in srgb,var(--fault) 5%,var(--chip))}
.node.unbound .nh{background:color-mix(in srgb,var(--fault) 9%,var(--chip-head))}
.ns.bad{color:var(--fault);background:color-mix(in srgb,var(--fault) 14%,transparent)}
.node.skipped,.node.muted{opacity:.42}
.node.dragging{cursor:grabbing;z-index:9}
.nh{display:flex;align-items:center;gap:7px;padding:6px 9px 5px 12px;background:var(--chip-head);
  border-bottom:1px solid var(--edge);min-height:24px}
/* who performs the step: filled = you, ring = Claude, square = Circuit itself */
.p1{width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:none}
.p1.by-user{background:var(--accent)}
.p1.by-claude{background:transparent;border:1.2px solid var(--ink-3)}
.p1.by-circuit{border-radius:1px;background:var(--ink-3);width:4.5px;height:4.5px}
.node.running .p1,.node.sel .p1{background:var(--accent);border-color:var(--accent)}
.node.running .p1.by-claude,.node.sel .p1.by-claude{background:transparent}
.nk{flex:1}
.ns{font-size:9.5px;letter-spacing:.02em;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:92px;flex:none;padding:1px 5px;border-radius:2px;
  background:color-mix(in srgb,var(--ink-3) 12%,transparent)}
.node.running .ns{color:var(--accent)} .node.done .ns{color:var(--ok)}
.node.held .ns{color:var(--wait)} .node.failed .ns{color:var(--fault)}
.nb{padding:10px 12px 12px}
.nt{font-size:14px;line-height:1.24;font-weight:600;letter-spacing:-.008em;margin:0 0 4px}
.nc{font-size:12px;line-height:1.4;color:var(--ink-3);margin:0;word-break:break-word}
.nc b{font-weight:500;color:var(--ink-2)}
.no{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.op{font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid var(--edge);
  color:var(--ink-3);background:var(--chip-2);letter-spacing:.01em}
.op.lit{border-color:var(--accent);color:var(--accent)}

.console{min-height:96px;border-top:1px solid var(--edge);background:var(--panel);display:flex}
.rail{width:190px;flex:none;border-right:1px solid var(--edge);padding:11px 13px;
  display:flex;flex-direction:column;gap:5px}
.spark{width:7px;height:7px;background:var(--accent);border-radius:1px;flex:none;
  animation:blink 1s steps(2) infinite}
.spark.idle{background:var(--ink-3);animation:none}
@keyframes blink{50%{opacity:.25}}
.sub{font-size:11px;color:var(--ink-3);line-height:1.35}
.railid{font-size:11px;color:var(--ink-2);letter-spacing:.01em}
pre.log{margin:0;flex:1;padding:12px 15px;overflow:hidden;font-size:11px;line-height:1.72;
  color:var(--ink-2);white-space:pre}
pre.log b{font-weight:400;color:var(--accent)} pre.log i{font-style:normal;color:var(--ink-3)}
.caret{display:inline-block;width:6px;height:11px;background:var(--accent);vertical-align:-1px;
  animation:blink .9s steps(2) infinite}

/* replay */
.replay{flex:1;display:flex;flex-direction:column;min-width:0}
.replay-head{display:flex;align-items:center;gap:10px;padding:9px 15px 7px}
.replay-head b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.replay-head .when{font-size:11px;color:var(--ink-3);white-space:nowrap}
.replay-head .sp{flex:1}
.step-btn{padding:3px 9px;font-size:12px;letter-spacing:0;text-transform:none}
.scrub{height:4px;background:var(--chip-2);border-top:1px solid var(--edge);
  border-bottom:1px solid var(--edge);display:flex;cursor:pointer}
.scrub i{flex:1;border-right:1px solid var(--board);transition:background .12s}
.scrub i.past{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.scrub i.at{background:var(--accent)}
.scrub i.fail{background:var(--fault)}
.io{display:flex;gap:0;flex:1;min-height:0}
.io div{flex:1;min-width:0;padding:9px 15px;overflow:hidden}
.io div + div{border-left:1px solid var(--edge)}
.io dt{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
  color:var(--ink-3);margin-bottom:3px}
.io pre{margin:0;font-family:"Spline Sans Mono",monospace;font-size:10.5px;line-height:1.55;
  color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:74px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 58px,transparent);
  mask-image:linear-gradient(180deg,#000 58px,transparent)}
.io pre.err{color:var(--fault)}

.insp{flex:1;padding:11px 15px;overflow:auto;font-size:12px;line-height:1.5;color:var(--ink-2)}
.insp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:baseline}
.insp dt{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.insp dd{margin:0;font-size:11.5px}
.insp code{font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--ink-2)}
.insp .warn{color:var(--fault)}
.insp pre.warn{color:var(--fault);margin-top:3px}
.insp pre{margin:4px 0 0;font-family:"Spline Sans Mono",monospace;font-size:10.5px;line-height:1.55;
  color:var(--ink-3);white-space:pre-wrap;word-break:break-word;max-height:52px;overflow:hidden}

.gate{border-top:1px solid var(--edge);background:var(--panel);padding:13px 15px}
.gate h4{margin:0 0 3px;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.gate.trouble{border-top:2px solid var(--fault)}
.gate.trouble h4{color:var(--fault)}
.gate.trouble .q{font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--ink-2);
  background:var(--chip);border:1px solid var(--edge);border-radius:3px;padding:8px 10px;
  white-space:pre-wrap;word-break:break-word}
.gate .q{font-size:11.5px;color:var(--ink-3);margin:0 0 9px}
.gate textarea{width:100%;min-height:92px;resize:vertical;background:var(--chip);color:var(--ink);
  border:1px solid var(--edge);border-radius:3px;padding:10px 12px;font-size:13px;line-height:1.6;
  font-family:"Instrument Sans",sans-serif}
.gate textarea:focus{outline:none;border-color:var(--accent)}
.gate .row{display:flex;gap:8px;margin-top:9px;align-items:center}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.empty span{font-size:12.5px}
@media (prefers-reduced-motion:reduce){.node{transition:none}.spark,.caret{animation:none}}
</style>
</head>
<body>
<div id="root"><div class="empty"><b>No board yet</b><span>Ask for an automation and it gets drawn here.</span></div></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
